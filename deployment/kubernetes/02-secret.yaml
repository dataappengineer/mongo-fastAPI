# Secret for MongoDB authentication credentials
# ⚠️ IMPORTANT: This is OPTIONAL - only needed if your MongoDB requires authentication
# ⚠️ SECURITY: Do NOT commit this file with real passwords to Git!

apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: dss  # Change if using a different namespace
  labels:
    app: fastapi-mongodb-api
type: Opaque
stringData:
  # ⚠️ CHANGE THIS: MongoDB username for API access
  username: "api_user"
  
  # ⚠️ CHANGE THIS: Use a strong password!
  password: "CHANGE_THIS_PASSWORD"

---
# Alternative: Create secret from command line (recommended for production)
# kubectl create secret generic mongodb-credentials \
#   --from-literal=username=your_username \
#   --from-literal=password=your_password \
#   --namespace=dss
