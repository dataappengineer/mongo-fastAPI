# Service to expose FastAPI application within the cluster

apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: dss  # Change if using a different namespace
  labels:
    app: fastapi-mongodb-api
spec:
  type: ClusterIP  # Internal service, exposed via Ingress
  
  selector:
    app: fastapi-mongodb-api
  
  ports:
  - name: http
    protocol: TCP
    port: 80        # Service port
    targetPort: 8000  # Container port
  
  # Session affinity (optional)
  sessionAffinity: None
